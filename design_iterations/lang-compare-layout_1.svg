<svg width="1440" height="1500" viewBox="0 0 1440 1500" xmlns="http://www.w3.org/2000/svg" style="font-family: sans-serif; font-size: 14px; background-color: #f9f9f9;">
    <title>Wireframe: Main Layout (Extended)</title>
    <desc>Desktop layout with Variables and Data Types sections.</desc>

    <!-- Page Background -->
    <rect x="0" y="0" width="1440" height="1500" fill="#f0f2f5" />

    <!-- Sticky Header -->
    <g id="header">
        <rect x="0" y="0" width="1440" height="64" fill="#ffffff" stroke="#e5e7eb" />
        <text x="24" y="38" font-size="20" font-weight="bold" fill="#111827">Lang Compare</text>
        
        <!-- daisyui: btn-group -->
        <g id="language-selector" transform="translate(300, 16)" daisyui-component="btn-group">
            <text x="0" y="-4" font-size="12" fill="#6b7280">Languages:</text>
            <rect x="0" y="8" width="80" height="32" rx="8" fill="#e5e7eb" /><text x="18" y="29" fill="#374151">Rust</text>
            <rect x="90" y="8" width="80" height="32" rx="8" fill="#e5e7eb" /><text x="105" y="29" fill="#374151">Python</text>
            <rect x="180" y="8" width="80" height="32" rx="8" fill="#d1d5db" /><text x="190" y="29" fill="#1f2937">TypeScript</text>
             <rect x="270" y="8" width="80" height="32" rx="8" fill="#e5e7eb" /><text x="280" y="29" fill="#374151">JavaScript</text>
        </g>

        <!-- Global Controls -->
        <g id="global-controls" transform="translate(1180, 20)">
            <!-- daisyui: join -->
            <g id="detail-toggle" daisyui-component="join">
                <rect x="0" y="0" width="70" height="32" rx="8" fill="#d1d5db" stroke="#a0a0a0" /><text x="15" y="21">Simple</text>
                <rect x="69" y="0" width="70" height="32" fill="#e5e7eb" stroke="#a0a0a0" /><text x="79" y="21">Detailed</text>
                <rect x="138" y="0" width="70" height="32" rx="8" fill="#e5e7eb" stroke="#a0a0a0" /><text x="153" y="21">Expert</text>
            </g>
            
            <!-- daisyui: dropdown -->
            <g id="theme-switcher" transform="translate(230, 0)" daisyui-component="dropdown">
                 <rect x="0" y="0" width="40" height="32" rx="8" fill="#e5e7eb" />
                 <path d="M15 12 L20 18 L25 12" stroke="#374151" fill="none" stroke-width="2"/>
            </g>
        </g>
    </g>

    <!-- daisyui: drawer (on mobile), visible block on desktop -->
    <g id="sidebar" daisyui-component="drawer">
        <rect x="0" y="64" width="240" height="1436" fill="#ffffff" stroke="#e5e7eb" />
        
        <!-- daisyui: menu -->
        <g id="feature-menu" transform="translate(20, 100)" daisyui-component="menu">
            <text x="0" y="0" font-weight="bold" fill="#6b7280" font-size="12">FEATURES</text>
            <text x="10" y="30" fill="#374151">Variables</text>
            <rect x="0" y="40" width="200" height="2" fill="#f3f4f6" />
            <text x="10" y="60" fill="#374151">Data Types</text>
            <rect x="0" y="70" width="200" height="2" fill="#f3f4f6" />
            <text x="10" y="90" fill="#374151">Functions</text>
            <rect x="0" y="100" width="200" height="2" fill="#f3f4f6" />
            <text x="10" y="120" fill="#374151">Control Flow</text>
            <rect x="0" y="130" width="200" height="2" fill="#f3f4f6" />
            <text x="10" y="150" fill="#374151">Error Handling</text>
        </g>
    </g>

    <!-- Main Content Area -->
    <g id="main-content" transform="translate(260, 84)">
        <!-- Variables Section -->
        <text x="0" y="0" font-size="18" font-weight="bold" fill="#111827">Variables</text>
        <g id="comparison-grid-variables" transform="translate(0, 30)">
            <!-- daisyui: card -->
            <g id="daisy-card-rust-vars" daisyui-component="card">
                <rect x="0" y="0" width="380" height="250" rx="12" fill="#ffffff" stroke="#e5e7eb" />
                <text x="15" y="25" font-weight="bold">Rust</text>
                <rect x="15" y="45" width="350" height="190" fill="#f3f4f6" />
                <text x="25" y="65" fill="#374151" font-family="monospace">// Code snippet...</text>
            </g>
            <g id="daisy-card-python-vars" daisyui-component="card" transform="translate(400, 0)">
                <rect x="0" y="0" width="380" height="250" rx="12" fill="#ffffff" stroke="#e5e7eb" />
                <text x="15" y="25" font-weight="bold">Python</text>
                <rect x="15" y="45" width="350" height="190" fill="#f3f4f6" />
                <text x="25" y="65" fill="#374151" font-family="monospace"># Code snippet...</text>
            </g>
            <g id="daisy-card-typescript-vars" daisyui-component="card" transform="translate(0, 270)">
                <rect x="0" y="0" width="380" height="250" rx="12" fill="#ffffff" stroke="#e5e7eb" />
                <text x="15" y="25" font-weight="bold">TypeScript</text>
                <rect x="15" y="45" width="350" height="190" fill="#f3f4f6" />
                <text x="25" y="65" fill="#374151" font-family="monospace">// Code snippet...</text>
            </g>
            <g id="daisy-card-javascript-vars" daisyui-component="card" transform="translate(400, 270)">
                <rect x="0" y="0" width="380" height="250" rx="12" fill="#ffffff" stroke="#e5e7eb" />
                <text x="15" y="25" font-weight="bold">JavaScript</text>
                <rect x="15" y="45" width="350" height="190" fill="#f3f4f6" />
                <text x="25" y="65" fill="#374151" font-family="monospace">// Code snippet...</text>
            </g>
        </g>

        <!-- Data Types Section -->
        <text x="0" y="570" font-size="18" font-weight="bold" fill="#111827">Data Types</text>
        <g id="comparison-grid-types" transform="translate(0, 600)">
            <!-- daisyui: card -->
            <g id="daisy-card-rust-types" daisyui-component="card">
                <rect x="0" y="0" width="380" height="250" rx="12" fill="#ffffff" stroke="#e5e7eb" />
                <text x="15" y="25" font-weight="bold">Rust</text>
                <rect x="15" y="45" width="350" height="190" fill="#f3f4f6" />
                <text x="25" y="65" fill="#374151" font-family="monospace">// Primitives, Structs...</text>
            </g>
            <g id="daisy-card-python-types" daisyui-component="card" transform="translate(400, 0)">
                <rect x="0" y="0" width="380" height="250" rx="12" fill="#ffffff" stroke="#e5e7eb" />
                <text x="15" y="25" font-weight="bold">Python</text>
                <rect x="15" y="45" width="350" height="190" fill="#f3f4f6" />
                <text x="25" y="65" fill="#374151" font-family="monospace"># Primitives, Objects...</text>
            </g>
            <g id="daisy-card-typescript-types" daisyui-component="card" transform="translate(0, 270)">
                <rect x="0" y="0" width="380" height="250" rx="12" fill="#ffffff" stroke="#e5e7eb" />
                <text x="15" y="25" font-weight="bold">TypeScript</text>
                <rect x="15" y="45" width="350" height="190" fill="#f3f4f6" />
                <text x="25" y="65" fill="#374151" font-family="monospace">// Primitives, Interfaces...</text>
            </g>
            <g id="daisy-card-javascript-types" daisyui-component="card" transform="translate(400, 270)">
                <rect x="0" y="0" width="380" height="250" rx="12" fill="#ffffff" stroke="#e5e7eb" />
                <text x="15" y="25" font-weight="bold">JavaScript</text>
                <rect x="15" y="45" width="350" height="190" fill="#f3f4f6" />
                <text x="25" y="65" fill="#374151" font-family="monospace">// Primitives, Objects...</text>
            </g>
        </g>
    </g>
</svg>